# PostgreSQL para desarrollo local. Uso: `pnpm db:up` desde la raíz.
# Solo escucha en 127.0.0.1: no queda expuesto a la red local.
name: control-financiero

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finanzas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: finanzas_dev
      TZ: UTC
      PGTZ: UTC
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U finanzas -d finanzas_dev']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
